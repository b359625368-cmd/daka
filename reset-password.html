<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>重设密码 · 成长打卡</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f7ff;color:#202b43;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px 18px}.card{max-width:460px;margin:10vh auto 0;background:#fff;border:1px solid #eeedf7;border-radius:24px;padding:28px;box-shadow:0 14px 36px #2e345e0b}h1{font-size:24px;margin:0 0 10px}p{color:#77809a;line-height:1.7}.field{display:block;width:100%;height:48px;margin:10px 0 20px;padding:12px 14px;border:1px solid #e9e7f5;border-radius:12px;background:#f8f8ff;font-size:16px}label{display:block;font-weight:700}button{width:100%;height:50px;border:0;border-radius:14px;background:#726aff;color:#fff;font-size:16px;font-weight:700}button:disabled{opacity:.5}.notice{margin-top:18px;min-height:24px;color:#614bc8}a{color:#7167ff}
  </style>
</head>
<body>
  <main class="card">
    <h1>重设成长打卡密码</h1>
    <p id="intro">请设置新密码。完成后回到小程序，用邮箱和新密码登录。</p>
    <form id="form" hidden>
      <label for="password">新密码</label>
      <input id="password" class="field" type="password" autocomplete="new-password" minlength="6" required placeholder="至少 6 位">
      <label for="confirm">再次输入</label>
      <input id="confirm" class="field" type="password" autocomplete="new-password" minlength="6" required placeholder="再次输入新密码">
      <button id="submit" type="submit">保存新密码</button>
    </form>
    <p id="notice" class="notice" role="status"></p>
  </main>
  <script>
    'use strict';
    const base = 'https://tldrblgsxbxxszfapppp.supabase.co';
    const key = 'sb_publishable_eroRHuOxy0y2a0kxTiVYcA_j0apDlyE';
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('access_token');
    const type = params.get('type');
    const notice = document.getElementById('notice');
    const form = document.getElementById('form');
    history.replaceState(null, '', location.pathname);
    if (params.get('error_description')) notice.textContent = '链接不可用或已过期，请回到小程序重新发送找回邮件。';
    else if (type !== 'recovery' || !token) notice.textContent = '没有有效的找回密码链接，请从邮件中的链接打开本页。';
    else form.hidden = false;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 6) return void (notice.textContent = '密码至少 6 位。');
      if (password !== confirm) return void (notice.textContent = '两次输入的密码不一致。');
      const button = document.getElementById('submit');
      button.disabled = true;
      notice.textContent = '正在保存…';
      try {
        const response = await fetch(base + '/auth/v1/user', {
          method: 'PUT',
          headers: { apikey: key, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (!response.ok) throw new Error(response.status === 401 ? '链接已过期，请重新发送找回邮件。' : '保存失败，请稍后重试。');
        form.hidden = true;
        notice.textContent = '密码已更新。请回到小程序，使用新密码登录。';
      } catch (error) {
        notice.textContent = error.message || '网络连接失败，请检查网络后重试。';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
